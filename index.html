<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

  <link
    href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css"
    rel="stylesheet"
  >

  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

  <link rel="stylesheet" href="style.css">

  <title>Teams R3</title>
</head>

<body>

<div class="app">

  <aside class="sidebar">

    <div class="team-name">Teams R3</div>

    <div class="section-title">Canaux</div>

    <div id="channels">
      <div class="loading-small">Chargement…</div>
    </div>

  </aside>

  <main class="main">

    <header class="header">

      <div class="channel-heading">
        <h1 id="channel-title">Chargement…</h1>
        <p id="channel-description"></p>
      </div>

      <div class="header-actions">

        <div class="current-user">
          <span class="user-label">Connecté en tant que</span>
          <select id="current-user-select"></select>
        </div>

        <button id="new-post-button" class="primary">
          + Nouvelle publication
        </button>

      </div>

    </header>

    <div class="feed-wrapper">

      <!-- NOUVELLE PUBLICATION -->

      <section id="composer" class="composer hidden">

        <div class="composer-top">
          <h2>Nouvelle publication</h2>

          <button
            id="close-composer"
            class="icon-button"
            type="button"
            aria-label="Fermer"
          >
            ×
          </button>
        </div>

        <div id="composer-message"></div>

        <div class="composer-grid">

          <div class="field">
            <label for="post-type">Type</label>

            <select id="post-type">
              <option value="Publication">Publication</option>
              <option value="Annonce">Annonce</option>
            </select>
          </div>

          <div class="field">
            <label for="post-title">Titre</label>

            <input
              id="post-title"
              type="text"
              placeholder="Titre de la publication"
            >
          </div>

        </div>

        <div class="field">
          <label>Message</label>

          <div id="post-editor" class="rich-editor"></div>

          <div class="field-hint">
            Astuce : tapez <strong>@Prénom</strong> pour mentionner visuellement un membre.
          </div>
        </div>

        <div class="field">
          <label for="post-link">Lien complémentaire</label>

          <input
            id="post-link"
            type="text"
            placeholder="https://..."
          >
        </div>

        <div class="composer-actions">

          <label
            id="post-pin-wrapper"
            class="checkbox-row hidden"
          >
            <input id="post-pin" type="checkbox">
            Épingler dans ce canal
          </label>

          <div class="composer-actions-right">

            <button
              id="cancel-post"
              class="secondary"
              type="button"
            >
              Annuler
            </button>

            <button
              id="publish-post"
              class="primary"
              type="button"
            >
              Publier
            </button>

          </div>

        </div>

      </section>

      <div id="feed">
        <div class="message">
          Connexion à Grist…
        </div>
      </div>

    </div>

  </main>

</div>


<!-- MODALE D'ÉDITION -->

<div id="edit-modal" class="modal hidden">

  <div class="modal-backdrop"></div>

  <div class="modal-dialog">

    <div class="modal-header">

      <h2 id="edit-modal-title">
        Modifier
      </h2>

      <button
        id="close-edit-modal"
        class="icon-button"
        type="button"
      >
        ×
      </button>

    </div>

    <div id="edit-post-fields">

      <div class="field">

        <label for="edit-type">
          Type
        </label>

        <select id="edit-type">
          <option value="Publication">Publication</option>
          <option value="Annonce">Annonce</option>
        </select>

      </div>

      <div class="field">

        <label for="edit-title">
          Titre
        </label>

        <input
          id="edit-title"
          type="text"
        >

      </div>

    </div>

    <div class="field">

      <label>
        Message
      </label>

      <div
        id="edit-editor"
        class="rich-editor"
      ></div>

    </div>

    <div id="edit-link-field" class="field">

      <label for="edit-link">
        Lien complémentaire
      </label>

      <input
        id="edit-link"
        type="text"
      >

    </div>

    <div
      id="edit-pin-field"
      class="field hidden"
    >

      <label class="checkbox-row">
        <input id="edit-pin" type="checkbox">
        Épingler
      </label>

    </div>

    <div class="modal-actions">

      <button
        id="cancel-edit"
        class="secondary"
        type="button"
      >
        Annuler
      </button>

      <button
        id="save-edit"
        class="primary"
        type="button"
      >
        Enregistrer
      </button>

    </div>

  </div>

</div>

<script src="app.js"></script>

</body>
</html>
