<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

  <link rel="stylesheet" href="style.css">

  <title>Teams R3</title>
</head>

<body>

<div class="app">

  <aside class="sidebar">

    <div class="team-name">Teams R3</div>

    <div class="section-title">Canaux</div>

    <div id="channels">
      <div class="loading-small">Chargement…</div>
    </div>

  </aside>

  <main class="main">

    <header class="header">

      <div>
        <h1 id="channel-title">Chargement…</h1>
        <p id="channel-description"></p>
      </div>

      <div class="header-actions">

        <div class="current-user">
          <span class="user-label">Connecté en tant que</span>
          <select id="current-user-select"></select>
        </div>

        <button id="new-post-button" class="primary">
          + Nouvelle publication
        </button>

      </div>

    </header>

    <div class="feed-wrapper">

      <div id="composer" class="composer hidden">

        <h2>Nouvelle publication</h2>

        <div id="composer-message"></div>

        <div class="field">
          <label for="post-title">Titre</label>
          <input
            id="post-title"
            type="text"
            placeholder="Titre de la publication"
          >
        </div>

        <div class="field">
          <label for="post-content">Message</label>
        <div class="rich-editor">

          <div class="rich-toolbar">
        
            <button
              type="button"
              title="Gras"
              onmousedown="event.preventDefault(); document.execCommand('bold');"
            >
              <strong>B</strong>
            </button>
        
            <button
              type="button"
              title="Italique"
              onmousedown="event.preventDefault(); document.execCommand('italic');"
            >
              <em>I</em>
            </button>
        
            <button
              type="button"
              title="Souligné"
              onmousedown="event.preventDefault(); document.execCommand('underline');"
            >
              <u>U</u>
            </button>
        
            <button
              type="button"
              title="Liste à puces"
              onmousedown="event.preventDefault(); document.execCommand('insertUnorderedList');"
            >
              • Liste
            </button>
        
            <button
              type="button"
              title="Liste numérotée"
              onmousedown="event.preventDefault(); document.execCommand('insertOrderedList');"
            >
              1. Liste
            </button>
        
          </div>
        
          <div
            id="post-rich-content"
            class="rich-content-editor"
            contenteditable="true"
            data-placeholder="Écrivez votre publication…"
          ></div>
        
        </div>
        
        <!--
          IMPORTANT :
          on conserve volontairement l'ancien textarea.
          app.js continue donc à trouver #post-content exactement comme avant.
        -->
        <textarea
          id="post-content"
          style="display:none;"
        ></textarea>
        </div>

        <div class="field">
          <label for="post-link">Lien</label>
          <input
            id="post-link"
            type="text"
            placeholder="https://..."
          >
        </div>

        <div class="composer-actions">

          <label class="checkbox-row">
            <input id="post-pin" type="checkbox">
            Épingler
          </label>

          <div class="composer-actions-right">

            <button id="cancel-post" class="secondary">
              Annuler
            </button>

            <button id="publish-post" class="primary">
              Publier
            </button>

          </div>

        </div>

      </div>

      <div id="feed">
        <div class="message">
          Connexion à Grist…
        </div>
      </div>

    </div>

  </main>

</div>

<!-- MODALE ÉDITION -->

<div id="edit-modal" class="modal hidden">

  <div class="modal-backdrop"></div>

  <div class="modal-dialog">

    <div class="modal-header">
      <h2 id="edit-modal-title">Modifier</h2>
      <button id="close-edit-modal" class="icon-button">×</button>
    </div>

    <div class="field" id="edit-title-field">
      <label for="edit-title">Titre</label>
      <input id="edit-title" type="text">
    </div>

    <div class="field">
      <label for="edit-content">Message</label>
      <textarea id="edit-content"></textarea>
    </div>

    <div class="field" id="edit-link-field">
      <label for="edit-link">Lien</label>
      <input id="edit-link" type="text">
    </div>

    <div id="edit-pin-field">
      <label class="checkbox-row">
        <input id="edit-pin" type="checkbox">
        Épingler
      </label>
    </div>

    <div class="modal-actions">

      <button id="cancel-edit" class="secondary">
        Annuler
      </button>

      <button id="save-edit" class="primary">
        Enregistrer
      </button>

    </div>

  </div>

</div>

<script src="app.js"></script>

<script>
  document.addEventListener("input", function (event) {

    if (event.target.id !== "post-rich-content") {
      return;
    }

    const richEditor =
      document.getElementById("post-rich-content");

    const oldTextarea =
      document.getElementById("post-content");

    /*
     * Première étape volontairement prudente :
     * app.js reçoit encore du texte brut.
     *
     * Donc aucune modification du stockage Grist.
     */
    oldTextarea.value =
      richEditor.innerText;
  });
</script>
  
</body>
</html>
