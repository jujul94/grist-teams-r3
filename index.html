<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

  <title>Teams R3</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: #242424;
      background: #ffffff;
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    /* ---------- CANAUX ---------- */

    .sidebar {
      width: 220px;
      flex-shrink: 0;
      background: #f5f5f5;
      border-right: 1px solid #e1e1e1;
      padding: 22px 12px;
    }

    .team-name {
      font-size: 18px;
      font-weight: 700;
      padding: 0 10px 22px;
    }

    .section-title {
      padding: 0 10px 8px;
      font-size: 11px;
      font-weight: 700;
      color: #666;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    #channels {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .channel {
      border: 0;
      background: transparent;
      text-align: left;
      padding: 10px 12px;
      border-radius: 7px;
      font-size: 14px;
      cursor: pointer;
      color: #333;
    }

    .channel:hover {
      background: #e9e9e9;
    }

    .channel.active {
      background: #e4e3f5;
      color: #3f3b78;
      font-weight: 600;
    }

    /* ---------- CONTENU ---------- */

    .main {
      flex: 1;
      min-width: 0;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 22px 30px 18px;
      background: rgba(255,255,255,.96);
      border-bottom: 1px solid #ededed;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
    }

    .header p {
      margin: 5px 0 0;
      color: #777;
      font-size: 13px;
    }

    .feed {
      max-width: 850px;
      padding: 25px 30px 80px;
    }

    /* ---------- PUBLICATION ---------- */

    .post {
      padding: 20px 0 25px;
      border-bottom: 1px solid #e5e5e5;
    }

    .post:first-child {
      padding-top: 0;
    }

    .post-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #6264a7;
      color: white;
      font-size: 13px;
      font-weight: 700;
    }

    .author {
      font-size: 14px;
      font-weight: 600;
    }

    .date {
      margin-top: 2px;
      font-size: 12px;
      color: #777;
    }

    .pin {
      display: inline-block;
      margin-bottom: 8px;
      font-size: 12px;
      color: #605e5c;
    }

    .post-title {
      margin: 5px 0 10px;
      font-size: 18px;
      font-weight: 650;
    }

    .post-content {
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .post-link {
      display: inline-block;
      margin-top: 10px;
      font-size: 13px;
    }

    /* ---------- COMMENTAIRES ---------- */

    .comments {
      margin: 18px 0 0 48px;
      padding-left: 16px;
      border-left: 2px solid #eeeeee;
    }

    .comments-title {
      margin-bottom: 12px;
      font-size: 12px;
      font-weight: 600;
      color: #666;
    }

    .comment {
      padding: 9px 0;
    }

    .comment-header {
      display: flex;
      gap: 7px;
      align-items: baseline;
    }

    .comment-author {
      font-size: 13px;
      font-weight: 600;
    }

    .comment-date {
      font-size: 11px;
      color: #888;
    }

    .comment-content {
      margin-top: 4px;
      font-size: 13px;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    /* ---------- ÉTATS ---------- */

    .message {
      padding: 35px 30px;
      color: #666;
    }

    .error {
      color: #b42318;
    }

    @media (max-width: 650px) {
      .sidebar {
        width: 160px;
      }

      .feed,
      .header {
        padding-left: 18px;
        padding-right: 18px;
      }

      .comments {
        margin-left: 15px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <aside class="sidebar">
    <div class="team-name">Teams R3</div>

    <div class="section-title">Canaux</div>

    <div id="channels">
      <div style="padding:10px;color:#777;font-size:13px;">
        Chargement…
      </div>
    </div>
  </aside>

  <main class="main">

    <header class="header">
      <h1 id="channel-title">Chargement…</h1>
      <p id="channel-description"></p>
    </header>

    <div id="feed" class="feed">
      <div class="message">
        Connexion à Grist…
      </div>
    </div>

  </main>

</div>

<script>

  let channels = [];
  let posts = [];
  let comments = [];
  let users = [];

  let currentChannel = null;

  /*
   * Le widget a besoin de lire plusieurs tables.
   * On demande donc l'accès au document.
   */
  grist.ready({
    requiredAccess: "full"
  });

  function rowsFromTable(table) {
    if (!table || !table.id) return [];

    const ids = table.id;

    return ids.map((id, index) => {
      const row = { id };

      Object.keys(table).forEach(column => {
        if (column !== "id") {
          row[column] = table[column][index];
        }
      });

      return row;
    });
  }

  function getUser(id) {
    return users.find(user => user.id === id);
  }

  function getUserName(id) {
    const user = getUser(id);

    if (!user) return "Utilisateur";

    return (
      user.Nom_affiche ||
      [user.Prenom, user.Nom].filter(Boolean).join(" ") ||
      "Utilisateur"
    );
  }

  function getInitials(id) {
    const user = getUser(id);

    if (!user) return "?";

    if (user.Initiales) return user.Initiales;

    const name = getUserName(id);

    return name
      .split(" ")
      .map(part => part[0])
      .join("")
      .substring(0, 2)
      .toUpperCase();
  }

  function formatDate(value) {
    if (!value) return "";

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
      return String(value);
    }

    return new Intl.DateTimeFormat("fr-FR", {
      day: "2-digit",
      month: "2-digit",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    }).format(date);
  }

  function escapeHtml(value) {
    if (value === null || value === undefined) return "";

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function renderChannels() {
    const container = document.getElementById("channels");

    container.innerHTML = "";

    const sortedChannels = [...channels].sort(
      (a, b) => (a.Ordre || 0) - (b.Ordre || 0)
    );

    sortedChannels.forEach(channel => {

      const button = document.createElement("button");

      button.className =
        "channel" +
        (currentChannel && currentChannel.id === channel.id
          ? " active"
          : "");

      const isPrivate =
        String(channel.Type_acces || "")
          .toLowerCase()
          .includes("encadrement");

      button.textContent =
        (isPrivate ? "🔒 " : "# ") +
        (channel.Nom || "Canal");

      button.addEventListener("click", () => {
        currentChannel = channel;

        renderChannels();
        renderFeed();
      });

      container.appendChild(button);
    });
  }

  function renderFeed() {

    const feed = document.getElementById("feed");
    const title = document.getElementById("channel-title");
    const description =
      document.getElementById("channel-description");

    if (!currentChannel) {
      feed.innerHTML =
        '<div class="message">Aucun canal disponible.</div>';

      return;
    }

    title.textContent = "# " + currentChannel.Nom;

    description.textContent =
      currentChannel.Description || "";

    let channelPosts = posts.filter(
      post =>
        post.Canal === currentChannel.id &&
        !post.Archive
    );

    /*
     * Épinglées d'abord,
     * puis publications les plus récentes.
     */
    channelPosts.sort((a, b) => {

      if (!!a.Epingle !== !!b.Epingle) {
        return a.Epingle ? -1 : 1;
      }

      return (
        new Date(b.Date_creation || 0) -
        new Date(a.Date_creation || 0)
      );
    });

    if (!channelPosts.length) {
      feed.innerHTML =
        '<div class="message">Aucune publication dans ce canal.</div>';

      return;
    }

    feed.innerHTML = "";

    channelPosts.forEach(post => {

      const article = document.createElement("article");

      article.className = "post";

      const postComments = comments
        .filter(
          comment =>
            comment.Publication === post.id &&
            !comment.Supprime
        )
        .sort(
          (a, b) =>
            new Date(a.Date_creation || 0) -
            new Date(b.Date_creation || 0)
        );

      const commentsHtml = postComments.length
        ? `
          <div class="comments">

            <div class="comments-title">
              ${postComments.length}
              ${postComments.length > 1
                ? "réponses"
                : "réponse"}
            </div>

            ${postComments.map(comment => `
              <div class="comment">

                <div class="comment-header">

                  <span class="comment-author">
                    ${escapeHtml(
                      getUserName(comment.Auteur)
                    )}
                  </span>

                  <span class="comment-date">
                    ${escapeHtml(
                      formatDate(comment.Date_creation)
                    )}
                  </span>

                </div>

                <div class="comment-content">${escapeHtml(
                  comment.Contenu
                )}</div>

              </div>
            `).join("")}

          </div>
        `
        : "";

      const linkHtml = post.Lien
        ? `
          <a
            class="post-link"
            href="${escapeHtml(post.Lien)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            🔗 Ouvrir le lien
          </a>
        `
        : "";

      article.innerHTML = `

        ${post.Epingle
          ? '<div class="pin">📌 Publication épinglée</div>'
          : ""}

        <div class="post-meta">

          <div class="avatar">
            ${escapeHtml(getInitials(post.Auteur))}
          </div>

          <div>

            <div class="author">
              ${escapeHtml(getUserName(post.Auteur))}
            </div>

            <div class="date">
              ${escapeHtml(formatDate(post.Date_creation))}
            </div>

          </div>

        </div>

        <div class="post-title">
          ${escapeHtml(post.Titre)}
        </div>

        <div class="post-content">${escapeHtml(
          post.Contenu
        )}</div>

        ${linkHtml}

        ${commentsHtml}
      `;

      feed.appendChild(article);
    });
  }

  async function loadData() {

    try {

      /*
       * fetchTable renvoie toutes les lignes
       * de chacune de nos tables.
       */

      const [
        channelsRaw,
        postsRaw,
        commentsRaw,
        usersRaw
      ] = await Promise.all([

        grist.docApi.fetchTable("Canaux"),
        grist.docApi.fetchTable("Publications"),
        grist.docApi.fetchTable("Commentaires"),
        grist.docApi.fetchTable("Utilisateurs")

      ]);

      channels = rowsFromTable(channelsRaw);
      posts = rowsFromTable(postsRaw);
      comments = rowsFromTable(commentsRaw);
      users = rowsFromTable(usersRaw);

      /*
       * On sélectionne Général par défaut.
       */

      currentChannel =
        channels.find(
          channel =>
            String(channel.Nom)
              .toLowerCase() === "général"
        ) ||
        channels[0] ||
        null;

      renderChannels();
      renderFeed();

    } catch (error) {

      console.error(error);

      document.getElementById("feed").innerHTML = `
        <div class="message error">
          <strong>Impossible de lire les données Grist.</strong>
          <br><br>
          ${escapeHtml(error.message || error)}
        </div>
      `;

    }
  }

  loadData();

</script>

</body>
</html>
