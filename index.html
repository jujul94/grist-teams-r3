<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

  <title>Teams R3</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: #242424;
      background: #fff;
    }

    button, input, textarea, select {
      font: inherit;
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 220px;
      flex-shrink: 0;
      background: #f7f7f7;
      border-right: 1px solid #e2e2e2;
      padding: 22px 12px;
    }

    .team-name {
      font-size: 18px;
      font-weight: 700;
      padding: 0 10px 22px;
    }

    .section-title {
      padding: 0 10px 8px;
      font-size: 11px;
      font-weight: 700;
      color: #666;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    #channels {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .channel {
      border: 0;
      background: transparent;
      text-align: left;
      padding: 10px 12px;
      border-radius: 7px;
      font-size: 14px;
      cursor: pointer;
      color: #333;
    }

    .channel:hover {
      background: #e9e9e9;
    }

    .channel.active {
      background: #e5e4f4;
      color: #3f3b78;
      font-weight: 600;
    }

    .main {
      flex: 1;
      min-width: 0;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 3;
      background: rgba(255,255,255,.97);
      border-bottom: 1px solid #ededed;
      padding: 20px 30px;
      display: flex;
      gap: 20px;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
    }

    .header p {
      margin: 4px 0 0;
      color: #777;
      font-size: 13px;
    }

    .primary {
      border: 0;
      border-radius: 7px;
      background: #6264a7;
      color: white;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: 600;
    }

    .primary:hover {
      opacity: .92;
    }

    .secondary {
      border: 1px solid #d5d5d5;
      border-radius: 7px;
      background: #fff;
      padding: 9px 13px;
      cursor: pointer;
    }

    .feed {
      max-width: 880px;
      padding: 25px 30px 80px;
    }

    .composer {
      border: 1px solid #dedede;
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 25px;
      background: #fff;
    }

    .composer.hidden {
      display: none;
    }

    .composer h2 {
      font-size: 17px;
      margin: 0 0 16px;
    }

    .field {
      margin-bottom: 13px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 5px;
      color: #555;
    }

    input[type="text"],
    textarea,
    select {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 7px;
      padding: 9px 10px;
      background: white;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .composer-actions {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-top: 14px;
    }

    .composer-actions-right {
      display: flex;
      gap: 8px;
    }

    .checkbox-row {
      display: flex;
      gap: 7px;
      align-items: center;
      font-size: 13px;
    }

    .post {
      padding: 20px 0 26px;
      border-bottom: 1px solid #e5e5e5;
    }

    .post:first-child {
      padding-top: 0;
    }

    .post-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #6264a7;
      color: white;
      font-size: 13px;
      font-weight: 700;
    }

    .author {
      font-size: 14px;
      font-weight: 600;
    }

    .date {
      margin-top: 2px;
      font-size: 12px;
      color: #777;
    }

    .pin {
      display: inline-block;
      margin-bottom: 8px;
      font-size: 12px;
      color: #605e5c;
    }

    .post-title {
      margin: 5px 0 10px;
      font-size: 18px;
      font-weight: 650;
    }

    .post-content {
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .post-link {
      display: inline-block;
      margin-top: 10px;
      font-size: 13px;
    }

    .comments {
      margin: 18px 0 0 48px;
      padding-left: 16px;
      border-left: 2px solid #eee;
    }

    .comments-title {
      margin-bottom: 12px;
      font-size: 12px;
      font-weight: 600;
      color: #666;
    }

    .comment {
      padding: 9px 0;
    }

    .comment-header {
      display: flex;
      gap: 7px;
      align-items: baseline;
    }

    .comment-author {
      font-size: 13px;
      font-weight: 600;
    }

    .comment-date {
      font-size: 11px;
      color: #888;
    }

    .comment-content {
      margin-top: 4px;
      font-size: 13px;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .reply-box {
      margin-top: 14px;
      display: grid;
      grid-template-columns: 150px 1fr auto;
      gap: 8px;
      align-items: end;
    }

    .reply-box textarea {
      min-height: 60px;
    }

    .reply-box select,
    .reply-box textarea {
      font-size: 13px;
    }

    .message {
      padding: 35px 0;
      color: #666;
    }

    .error {
      color: #b42318;
    }

    .success {
      color: #267a3c;
      font-size: 13px;
      margin-bottom: 12px;
    }

    @media (max-width: 750px) {
      .sidebar {
        width: 160px;
      }

      .header,
      .feed {
        padding-left: 18px;
        padding-right: 18px;
      }

      .comments {
        margin-left: 12px;
      }

      .reply-box {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <aside class="sidebar">
    <div class="team-name">Teams R3</div>

    <div class="section-title">Canaux</div>

    <div id="channels">
      <div style="padding:10px;color:#777;font-size:13px;">
        Chargement…
      </div>
    </div>
  </aside>

  <main class="main">

    <header class="header">

      <div>
        <h1 id="channel-title">Chargement…</h1>
        <p id="channel-description"></p>
      </div>

      <button id="new-post-button" class="primary">
        + Nouvelle publication
      </button>

    </header>

    <div class="feed">

      <div id="composer" class="composer hidden">

        <h2>Nouvelle publication</h2>

        <div id="composer-message"></div>

        <div class="field">
          <label for="post-author">Auteur</label>
          <select id="post-author"></select>
        </div>

        <div class="field">
          <label for="post-title">Titre</label>
          <input
            id="post-title"
            type="text"
            placeholder="Titre de la publication"
          >
        </div>

        <div class="field">
          <label for="post-content">Message</label>
          <textarea
            id="post-content"
            placeholder="Écrivez votre publication…"
          ></textarea>
        </div>

        <div class="field">
          <label for="post-link">Lien</label>
          <input
            id="post-link"
            type="text"
            placeholder="https://..."
          >
        </div>

        <div class="composer-actions">

          <label class="checkbox-row">
            <input id="post-pin" type="checkbox">
            Épingler
          </label>

          <div class="composer-actions-right">
            <button id="cancel-post" class="secondary">
              Annuler
            </button>

            <button id="publish-post" class="primary">
              Publier
            </button>
          </div>

        </div>

      </div>

      <div id="feed">
        <div class="message">
          Connexion à Grist…
        </div>
      </div>

    </div>

  </main>

</div>

<script>

  const TABLES = {
    users: "Utilisateurs",
    channels: "Canaux",
    posts: "Publications",
    comments: "Commentaires"
  };

  let channels = [];
  let posts = [];
  let comments = [];
  let users = [];
  let currentChannel = null;

  grist.ready({
    requiredAccess: "full"
  });

  function rowsFromTable(table) {
    if (!table || !table.id) return [];

    return table.id.map((id, index) => {
      const row = { id };

      Object.keys(table).forEach(column => {
        if (column !== "id") {
          row[column] = table[column][index];
        }
      });

      return row;
    });
  }

  function getUser(id) {
    return users.find(user => user.id === id);
  }

  function getUserName(id) {
    const user = getUser(id);

    if (!user) return "Utilisateur";

    return (
      user.Nom_affiche ||
      [user.Prenom, user.Nom].filter(Boolean).join(" ") ||
      "Utilisateur"
    );
  }

  function getInitials(id) {
    const user = getUser(id);

    if (!user) return "?";

    if (user.Initiales) return user.Initiales;

    return getUserName(id)
      .split(" ")
      .map(part => part[0])
      .join("")
      .substring(0, 2)
      .toUpperCase();
  }

  function formatDate(value) {
    if (!value) return "";

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
      return String(value);
    }

    return new Intl.DateTimeFormat("fr-FR", {
      day: "2-digit",
      month: "2-digit",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    }).format(date);
  }

  function escapeHtml(value) {
    if (value === null || value === undefined) return "";

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function populateUserSelects() {
    const select = document.getElementById("post-author");

    select.innerHTML = "";

    users
      .filter(user => user.Actif !== false)
      .forEach(user => {
        const option = document.createElement("option");
        option.value = user.id;
        option.textContent = getUserName(user.id);
        select.appendChild(option);
      });
  }

  function renderChannels() {
    const container = document.getElementById("channels");
    container.innerHTML = "";

    [...channels]
      .sort((a, b) => (a.Ordre || 0) - (b.Ordre || 0))
      .forEach(channel => {

        const button = document.createElement("button");

        button.className =
          "channel" +
          (currentChannel && currentChannel.id === channel.id
            ? " active"
            : "");

        const isPrivate =
          String(channel.Type_acces || "")
            .toLowerCase()
            .includes("encadrement");

        button.textContent =
          (isPrivate ? "🔒 " : "# ") +
          (channel.Nom || "Canal");

        button.addEventListener("click", () => {
          currentChannel = channel;
          closeComposer();
          renderChannels();
          renderFeed();
        });

        container.appendChild(button);
      });
  }

  function renderFeed() {
    const feed = document.getElementById("feed");
    const title = document.getElementById("channel-title");
    const description = document.getElementById("channel-description");

    if (!currentChannel) {
      feed.innerHTML =
        '<div class="message">Aucun canal disponible.</div>';
      return;
    }

    title.textContent = "# " + currentChannel.Nom;
    description.textContent = currentChannel.Description || "";

    let channelPosts = posts.filter(
      post =>
        post.Canal === currentChannel.id &&
        !post.Archive
    );

    channelPosts.sort((a, b) => {
      if (!!a.Epingle !== !!b.Epingle) {
        return a.Epingle ? -1 : 1;
      }

      return (
        new Date(b.Date_creation || 0) -
        new Date(a.Date_creation || 0)
      );
    });

    if (!channelPosts.length) {
      feed.innerHTML =
        '<div class="message">Aucune publication dans ce canal.</div>';
      return;
    }

    feed.innerHTML = "";

    channelPosts.forEach(post => {

      const article = document.createElement("article");
      article.className = "post";

      const postComments = comments
        .filter(
          comment =>
            comment.Publication === post.id &&
            !comment.Supprime
        )
        .sort(
          (a, b) =>
            new Date(a.Date_creation || 0) -
            new Date(b.Date_creation || 0)
        );

      const commentsHtml = postComments.length
        ? `
          <div class="comments-title">
            ${postComments.length}
            ${postComments.length > 1 ? "réponses" : "réponse"}
          </div>

          ${postComments.map(comment => `
            <div class="comment">

              <div class="comment-header">

                <span class="comment-author">
                  ${escapeHtml(getUserName(comment.Auteur))}
                </span>

                <span class="comment-date">
                  ${escapeHtml(formatDate(comment.Date_creation))}
                </span>

              </div>

              <div class="comment-content">${escapeHtml(
                comment.Contenu
              )}</div>

            </div>
          `).join("")}
        `
        : "";

      const userOptions = users
        .filter(user => user.Actif !== false)
        .map(user => `
          <option value="${user.id}">
            ${escapeHtml(getUserName(user.id))}
          </option>
        `)
        .join("");

      article.innerHTML = `

        ${post.Epingle
          ? '<div class="pin">📌 Publication épinglée</div>'
          : ""}

        <div class="post-meta">

          <div class="avatar">
            ${escapeHtml(getInitials(post.Auteur))}
          </div>

          <div>

            <div class="author">
              ${escapeHtml(getUserName(post.Auteur))}
            </div>

            <div class="date">
              ${escapeHtml(formatDate(post.Date_creation))}
            </div>

          </div>

        </div>

        <div class="post-title">
          ${escapeHtml(post.Titre)}
        </div>

        <div class="post-content">${escapeHtml(post.Contenu)}</div>

        ${post.Lien
          ? `
            <a
              class="post-link"
              href="${escapeHtml(post.Lien)}"
              target="_blank"
              rel="noopener noreferrer"
            >
              🔗 Ouvrir le lien
            </a>
          `
          : ""}

        <div class="comments">

          ${commentsHtml}

          <div class="reply-box">

            <select class="reply-author">
              ${userOptions}
            </select>

            <textarea
              class="reply-content"
              placeholder="Répondre à cette publication…"
            ></textarea>

            <button class="primary reply-button">
              Répondre
            </button>

          </div>

        </div>
      `;

      article
        .querySelector(".reply-button")
        .addEventListener("click", async () => {

          const authorId = Number(
            article.querySelector(".reply-author").value
          );

          const content =
            article.querySelector(".reply-content").value.trim();

          if (!content) {
            alert("Écris une réponse avant de l'envoyer.");
            return;
          }

          await createComment(
            post.id,
            authorId,
            content
          );

        });

      feed.appendChild(article);
    });
  }

  function openComposer() {
    document
      .getElementById("composer")
      .classList.remove("hidden");

    document
      .getElementById("post-title")
      .focus();
  }

  function closeComposer() {
    document
      .getElementById("composer")
      .classList.add("hidden");

    document.getElementById("post-title").value = "";
    document.getElementById("post-content").value = "";
    document.getElementById("post-link").value = "";
    document.getElementById("post-pin").checked = false;
    document.getElementById("composer-message").innerHTML = "";
  }

  async function createPost() {

    if (!currentChannel) return;

    const authorId = Number(
      document.getElementById("post-author").value
    );

    const title =
      document.getElementById("post-title").value.trim();

    const content =
      document.getElementById("post-content").value.trim();

    const link =
      document.getElementById("post-link").value.trim();

    const pin =
      document.getElementById("post-pin").checked;

    if (!title) {
      document.getElementById("composer-message").innerHTML =
        '<div class="error">Le titre est obligatoire.</div>';
      return;
    }

    if (!content) {
      document.getElementById("composer-message").innerHTML =
        '<div class="error">Le message est obligatoire.</div>';
      return;
    }

    try {

      await grist.docApi.applyUserActions([
        [
          "AddRecord",
          TABLES.posts,
          null,
          {
            Canal: currentChannel.id,
            Auteur: authorId,
            Date_creation: Date.now() / 1000,
            Titre: title,
            Contenu: content,
            Epingle: pin,
            Lien: link,
            Archive: false
          }
        ]
      ]);

      closeComposer();
      await loadData();

    } catch (error) {
      console.error(error);

      document.getElementById("composer-message").innerHTML =
        `
          <div class="error">
            Impossible de publier : ${escapeHtml(error.message || error)}
          </div>
        `;
    }
  }

  async function createComment(postId, authorId, content) {

    try {

      await grist.docApi.applyUserActions([
        [
          "AddRecord",
          TABLES.comments,
          null,
          {
            Publication: postId,
            Auteur: authorId,
            Date_creation: Date.now() / 1000,
            Contenu: content,
            Supprime: false
          }
        ]
      ]);

      await loadData();

    } catch (error) {
      console.error(error);
      alert(
        "Impossible d'ajouter la réponse : " +
        (error.message || error)
      );
    }
  }

  async function loadData() {

    try {

      const [
        channelsRaw,
        postsRaw,
        commentsRaw,
        usersRaw
      ] = await Promise.all([

        grist.docApi.fetchTable(TABLES.channels),
        grist.docApi.fetchTable(TABLES.posts),
        grist.docApi.fetchTable(TABLES.comments),
        grist.docApi.fetchTable(TABLES.users)

      ]);

      const previousChannelId =
        currentChannel ? currentChannel.id : null;

      channels = rowsFromTable(channelsRaw);
      posts = rowsFromTable(postsRaw);
      comments = rowsFromTable(commentsRaw);
      users = rowsFromTable(usersRaw);

      if (previousChannelId) {
        currentChannel =
          channels.find(
            channel => channel.id === previousChannelId
          ) || null;
      }

      if (!currentChannel) {
        currentChannel =
          channels.find(
            channel =>
              String(channel.Nom)
                .toLowerCase() === "général"
          ) ||
          channels[0] ||
          null;
      }

      populateUserSelects();
      renderChannels();
      renderFeed();

    } catch (error) {

      console.error(error);

      document.getElementById("feed").innerHTML = `
        <div class="message error">
          <strong>Impossible de lire les données Grist.</strong>
          <br><br>
          ${escapeHtml(error.message || error)}
        </div>
      `;

    }
  }

  document
    .getElementById("new-post-button")
    .addEventListener("click", openComposer);

  document
    .getElementById("cancel-post")
    .addEventListener("click", closeComposer);

  document
    .getElementById("publish-post")
    .addEventListener("click", createPost);

  loadData();

</script>

</body>
</html>
